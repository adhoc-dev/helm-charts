  adhoc-cluster-sentinel:
  - annotations:
      category: DevOps
    apiVersion: v2
    appVersion: clusterSentinel-2026.07.27.1
    created: "2026-08-05T20:31:59.940252241Z"
    description: 'Plataforma genérica de supervisión de un cluster Kubernetes: corre
      múltiples checks enchufables que observan el cluster y, ante algo "sano para
      k8s pero roto de verdad" sostenido, actúan (recrear un pod, etc.) con guardrails
      uniformes. Checks: gcsfuse-mount (fuente k8s), memory-pressure (fuente Prometheus). '
    digest: 3a9d9b9df97e7013e4bd4c2dcee76da372fc36cf67b95ade3907846f1c7336f3
    home: https://github.com/adhoc-dev/helm-charts
