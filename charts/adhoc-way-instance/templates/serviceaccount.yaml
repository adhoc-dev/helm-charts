{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "adhoc-way-instance.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adhoc-way-instance.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No permission is bound to it anywhere: it exists to be an identity, not an access.
# What it can do in the cluster is nothing; what it proves is which instance this is.
automountServiceAccountToken: false
{{- end }}
