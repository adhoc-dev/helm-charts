apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "adhoc-cluster-sentinel.fullname" . }}
  labels:
    {{- include "adhoc-cluster-sentinel.labels" . | nindent 4 }}
rules:
  # List pods clusterwide to run the detectors, and delete the confirmed-broken
  # ones so their Deployment recreates them. This is the controller's whole job.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  # Read-only, for pv-zone-stuck: a pod stranded by its disk does not say WHICH zone
  # it is stuck in — that is only on the PV its claim is bound to.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list"]
  # cnpg-resize-stuck: only the CR says whether the database is hibernated — that is the
  # case where the pod does not exist. See doc/infrastructure-charts.md.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["list"]
  # node-memory-pressure: `list` reads allocatable and schedulability of every node, to
  # prove a concrete destination exists before moving anything, and to find cordons left
  # by a dead incarnation. `patch` is the cordon itself — the node under pressure looks
  # roomy to the scheduler, so closing it for the seconds the surge takes is the only way
  # the replacement cannot land back on it. Bounded by one cordoned node cluster-wide and
  # released in a `finally`, with the annotation as the reconciliation key.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "patch"]
  # node-memory-pressure again: `get` on replicasets resolves pod -> Deployment, `get` on
  # deployments reads the real rollout strategy (the zero-downtime guarantee is verified,
  # never assumed), and `patch` is the rollout restart itself.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # helm-release-stuck: Helm release state lives in Secrets. Cluster-wide on purpose —
  # see doc/infrastructure-charts.md.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
