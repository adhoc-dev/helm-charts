{{- if .Values.cloudNativePG.enabled }}
# Ingress al Postgres: default-deny con allowlist explícita.
#
# Ojo con el alcance: en un namespace sin ninguna NetworkPolicy efectiva, la primera que
# matchee un pod convierte ese ingress de "todo permitido" a "denegado lo no listado". Por
# eso la allowlist de abajo tiene que cubrir TODO el tráfico legítimo hacia la base, no
# solo el de Odoo. Las probes del kubelet no hacen falta listarlas: Kubernetes NetworkPolicy
# no filtra el tráfico del nodo hacia el pod (validado además en GKE Dataplane V2).
#
# Al agregar o cambiar reglas acá, tener presente que lo que conecta a la base NO es solo
# Odoo en régimen: los flujos EPISÓDICOS (crear, restaurar, actualizar) usan jobs propios y
# son los que no se ven mirando una base ya andando. Validar contra una creación de base
# completa, no contra pg_stat_activity de una base en régimen.
#
# Lo que esta allowlist NO cubre, si alguna vez aparece: poolers (pgBouncer / Pooler de
# CNPG), standby o subscribers lógicos fuera del namespace, y tooling externo que conecte
# por SQL (dumps, BI, CDC, migraciones ad-hoc desde otro pod). Hoy no existe ninguno en la
# flota; el día que se sume uno hay que darle su regla acá.
#
# El selector va con el helper de nombre del Cluster, no con adhoc-odoo.fullname: los pods
# los etiqueta el operador a partir del nombre del CR, que se arma con sanitizedPgName.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adhoc-odoo.fullname" . }}-pg-ingress
  labels:
    {{- include "adhoc-odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "cnpg.pgClusterName" . }}
  policyTypes:
    - Ingress
  ingress:
    # Odoo del propio namespace: el único origen legítimo de tráfico SQL. Se discrimina por
    # adhoc.ar/app-name porque los pods de nginx comparten los app.kubernetes.io/*.
    - from:
        - podSelector:
            matchLabels:
              adhoc.ar/app-name: "odoo"
      ports:
        - protocol: TCP
          port: 5432
    # Hook wait-pg del propio chart: corre pg_isready en post-install y post-upgrade. Sin
    # esta regla el hook falla y con él el helm upgrade entero.
    - from:
        - podSelector:
            matchLabels:
              adhoc.ar/app-name: "pg-hook"
      ports:
        - protocol: TCP
          port: 5432
    # Jobs del pipeline SaaS (fixdb, restore, ...). NO los crea este chart, así que no
    # aparecen en el render: los crea el provider en el namespace de la base y todos llevan
    # la clave adhoc.ar/odoo-job. Se matchea por Exists para cubrir los que se sumen.
    # Sin esta regla la creación de una base queda colgada en "Waiting until the database
    # server is listening..." y nunca termina.
    - from:
        - podSelector:
            matchExpressions:
              - key: adhoc.ar/odoo-job
                operator: Exists
      ports:
        - protocol: TCP
          port: 5432
    # Réplicas del propio cluster: streaming replication contra el primario.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "cnpg.pgClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
    # Prometheus scrapea el exporter del instance manager (PodMonitor de cnpg).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
    # El operador CNPG consulta el instance manager: /healthz, /readyz, /pg/status.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
