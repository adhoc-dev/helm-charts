nameOverride: ""
fullnameOverride: ""

# Full host served by the pod, e.g. <prefix>.<platform-domain>.  (REQUIRED)
host: ""

# Odoo user that owns this instance (informational; goes to annotations).
user:
  id: ""
  email: ""

# --- The third-party web tool that runs in the pod ---
# Only the auth-proxy sidecar is exposed in the Service; the tool is reached over
# 127.0.0.1 inside the pod. It should listen on the configured `port` (ideally on
# 127.0.0.1 for anti-bypass; the default tool, openCode, binds 0.0.0.0, so the
# Service + NetworkPolicy are the enforced boundary).
# Defaults below run openCode; override tool.* for a different tool.
tool:
  image:
    repository: docker.io/adhoc/ops-tools
    tag: adhocWayWorkspace-2026.08.07.1
    # digest: pin to an exact image (overrides tag). Format: sha256:<hash>
    digest: ""
    pullPolicy: Always
  # Port the tool listens on (localhost).
  port: 3001
  # Env var name to receive the tool's own public URL, injected as https://<host>.
  # openCode needs it (OPENCODE_PUBLIC_URL) for its web/OAuth flows behind a proxy.
  # Set to "" for tools that don't need it.
  publicUrlEnvVar: OPENCODE_PUBLIC_URL
  command: []
  args: []
  # Defaults for openCode. OPENCODE_CONTAINER_PORT must match `port`.
  env:
    - name: OPENCODE_CONTAINER_PORT
      value: "4096"
    - name: OPENCODE_BUNDLES
      value: ""
  volumeMounts: []
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

# --- Authentication sidecar (adhocwayAuthProxy) ---
authProxy:
  image:
    repository: docker.io/adhoc/ops-tools
    tag: adhocwayAuthProxy-2026.08.04.1
    digest: ""
    pullPolicy: Always
  listenPort: 8080
  cookieName: way_session
  sessionTtl: 12h
  # Max lifetime the proxy accepts on an entry token. Kept above the signer's
  # entryTtl (5m) so a freshly-minted token always validates (provisioning wait).
  maxEntryTtl: 10m
  # ConfigMap (same namespace) with the signer Ed25519 public key.
  # Created by adhoc-way-platform.
  entryPubKeyConfigMap: adhoc-way-platform-entry-pubkey
  entryPubKeyKey: pubkey
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

service:
  port: 80

ingress:
  istio:
    enabled: true
    # Dedicated *.<domain> Gateway (from the adhoc-way-platform chart).
    gateway: adhoc-way-platform-gateway

# Accept ingress to the proxy port only from the ingress gateway namespace.
# Defense in depth — the tool already listens only on 127.0.0.1.
networkPolicy:
  enabled: true
  gatewayNamespace: istio-system

# --- User state ---
# The volume lives in its own release (chart adhoc-way-user) because it belongs to
# the USER, not to this instance: a user may open more than one surface and all of
# them must see the same files.
state:
  # Claim created by adhoc-way-user (its release name). Empty = ephemeral
  # emptyDir, which is fine for a smoke test and wrong for a person.
  existingClaim: ""
  # Everything the user owns lives under the home: agent state in dotfiles and
  # projects in workspace/.
  mountPath: /home/odoo
  # Mounting a subdirectory instead of the volume root lets the same disk hold
  # more than one thing later, and keeps the filesystem's lost+found out of the
  # user's home.
  subPath: home

# fsGroup must match the group of the tool image's user (1001 in
# adhocWayWorkspace), or the pod cannot write to its own volume.
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

volumes: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
