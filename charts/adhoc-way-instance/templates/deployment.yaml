{{- include "adhoc-way-instance.validateSources" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adhoc-way-instance.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adhoc-way-instance.labels" . | nindent 4 }}
  annotations:
    adhoc.inc/way-host: {{ .Values.host | quote }}
    {{- with .Values.user.id }}
    adhoc.inc/way-user-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.user.email }}
    adhoc.inc/way-user-email: {{ . | quote }}
    {{- end }}
spec:
  replicas: 1
  # The old pod has to be gone before the new one starts: they share one volume, and a
  # ReadWriteOnce disk attaches to a single node. Rolling would also keep serving the
  # old pod until the new one is ready, so an upgrade would not be visible to the person.
  #
  # maxSurge 0 and not `type: Recreate`, which does the same at one replica but cannot be
  # applied to a Deployment that already exists: the default rollingUpdate stays in the
  # object and the API server refuses it next to Recreate.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "adhoc-way-instance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adhoc-way-instance.selectorLabels" . | nindent 8 }}
        {{- include "adhoc-way-instance.adhocLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # fsGroup no es opcional cuando hay volumen: un disco recién provisionado
      # es de root, y el tool corre como usuario no-root. Sin esto el pod arranca
      # y muere al no poder escribir su propio home.
      # OnRootMismatch evita que kubelet recorra y chownee el volumen entero en
      # cada arranque — con un checkout de fuentes adentro, eso se nota.
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.podSecurityContext.fsGroupChangePolicy }}
      serviceAccountName: {{ include "adhoc-way-instance.serviceAccountName" . }}
      # The default mount is a token the API server accepts; nothing here talks to it.
      # The only token in the pod is the one projected below, which is good for the
      # platform and for nothing else.
      automountServiceAccountToken: false
      {{- if .Values.sources }}
      # Las fuentes se montan adentro del workspace, y el mountpoint lo crea el
      # runtime ANTES del entrypoint: si la raíz no existe todavía la crea él, como
      # root, y el pod no arranca porque el usuario no puede escribir ahí (el
      # entrypoint lo dice y corta). fsGroup no alcanza — se aplica al montar el
      # volumen, y esto pasa después. Creándola acá queda del usuario, y el
      # mountpoint cuelga adentro sin cambiarle el dueño. Solo mkdir, y sin las
      # fuentes montadas: montarlas también acá volvería a crear el mountpoint.
      initContainers:
        - name: workspace-root
          image: "{{ .Values.tool.image.repository }}{{ if .Values.tool.image.digest }}@{{ .Values.tool.image.digest }}{{ else }}:{{ .Values.tool.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.tool.image.pullPolicy }}
          # El `-w` no es de más: si la raíz YA existe y es de root —un volumen que
          # arrancó alguna vez sin este initContainer— el mkdir es no-op y el pod
          # fallaría más adelante. Recuperarlo necesita root, así que el mensaje
          # lo dice acá en vez de dejar que parezca un problema del entrypoint.
          command:
            - sh
            - -c
            - |
              mkdir -p "$WORKSPACES_ROOT"
              [ -w "$WORKSPACES_ROOT" ] || {
                echo "ERROR: $WORKSPACES_ROOT existe y no es de este usuario:"
                ls -ld "$WORKSPACES_ROOT"
                echo "Lo creó el runtime como root en un arranque sin este initContainer."
                echo "Hay que corregirle el dueño con root; desde acá no se puede."
                exit 1
              }
          env:
            - name: WORKSPACES_ROOT
              value: {{ include "adhoc-way-instance.workspaceRoot" . | quote }}
          volumeMounts:
            - name: user-state
              mountPath: {{ .Values.state.mountPath }}
              {{- with .Values.state.subPath }}
              subPath: {{ . }}
              {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        # --- gate: the only exposed port of the pod ---
        - name: auth-proxy
          image: "{{ .Values.authProxy.image.repository }}{{ if .Values.authProxy.image.digest }}@{{ .Values.authProxy.image.digest }}{{ else }}:{{ .Values.authProxy.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authProxy.listenPort }}
              protocol: TCP
          env:
            - name: WAY_HOST
              value: {{ .Values.host | quote }}
            - name: WAY_UPSTREAM
              value: "http://127.0.0.1:{{ .Values.tool.port }}"
            - name: WAY_LISTEN
              value: ":{{ .Values.authProxy.listenPort }}"
            - name: WAY_COOKIE_NAME
              value: {{ .Values.authProxy.cookieName | quote }}
            - name: WAY_SESSION_TTL
              value: {{ .Values.authProxy.sessionTtl | quote }}
            - name: WAY_MAX_ENTRY_TTL
              value: {{ .Values.authProxy.maxEntryTtl | quote }}
            - name: WAY_ENTRY_PUBKEY
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.authProxy.entryPubKeyConfigMap }}
                  key: {{ .Values.authProxy.entryPubKeyKey }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            # numeric uid so kubelet can verify non-root (the image's user is a
            # non-numeric name, which fails runAsNonRoot with CreateContainerConfigError)
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
        # --- tool: listens on 127.0.0.1, no port in the Service ---
        - name: tool
          image: "{{ .Values.tool.image.repository }}{{ if .Values.tool.image.digest }}@{{ .Values.tool.image.digest }}{{ else }}:{{ .Values.tool.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.tool.image.pullPolicy }}
          {{- with .Values.tool.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tool.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (and .Values.tool.publicUrlEnvVar .Values.host) .Values.tool.env .Values.github.credentialUrl .Values.workspace.projects .Values.user.name .Values.user.email .Values.sources }}
          env:
            {{- if and .Values.tool.publicUrlEnvVar .Values.host }}
            # The tool's own public URL, derived from host (e.g. openCode's OAuth/web).
            - name: {{ .Values.tool.publicUrlEnvVar | quote }}
              value: {{ printf "https://%s" .Values.host | quote }}
            {{- end }}
            {{- with .Values.user.name }}
            # The identity git commits with inside the workspace.
            - name: ADHOCWAY_USER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.user.email }}
            - name: ADHOCWAY_USER_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.workspace.projects }}
            # Rendered as JSON: the entrypoint clones or updates what is in it.
            - name: ADHOCWAY_WORKSPACE
              value: {{ toJson .Values.workspace | quote }}
            {{- end }}
            {{- if .Values.sources }}
            {{- $wsRoot := include "adhoc-way-instance.workspaceRoot" $ }}
            {{- $links := list }}
            {{- range .Values.sources }}
            {{- $links = append $links (dict "target" (include "adhoc-way-instance.sourceTarget" (merge (dict "workspaceRoot" $wsRoot) .)) "link" .dstPath) }}
            {{- end }}
            # Where the workspace root is, so the chart and the image cannot disagree
            # about where the mounts land.
            - name: WORKSPACES_ROOT
              value: {{ $wsRoot | quote }}
            # Where each mount is and where it goes: the entrypoint links them.
            - name: ADHOCWAY_SOURCES
              value: {{ toJson $links | quote }}
            {{- end }}
            {{- with .Values.github.credentialUrl }}
            # Where the git credential helper asks, and the token it proves itself with.
            # A file and not a value: the projected token rotates, an env var cannot.
            - name: ADHOCWAY_CREDENTIAL_URL
              value: {{ . | quote }}
            - name: ADHOCWAY_WORKSPACE_TOKEN_FILE
              value: {{ printf "%s/token" (trimSuffix "/" $.Values.github.tokenMountPath) | quote }}
            {{- end }}
            {{- with .Values.tool.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            # Un solo montaje: adentro de /home/odoo viven la configuración de
            # los agentes y los proyectos del usuario.
            - name: user-state
              mountPath: {{ .Values.state.mountPath }}
              {{- with .Values.state.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- if .Values.github.credentialUrl }}
            - name: workspace-token
              mountPath: {{ trimSuffix "/" .Values.github.tokenMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- $wsRoot := include "adhoc-way-instance.workspaceRoot" $ }}
            {{- range .Values.sources }}
            - name: {{ include "adhoc-way-instance.sourceName" . }}
              mountPath: {{ include "adhoc-way-instance.sourceMount" (merge (dict "workspaceRoot" $wsRoot) .) | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.tool.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.tool.resources | nindent 12 }}
          {{- with .Values.tool.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: user-state
          {{- if .Values.state.persistent }}
          persistentVolumeClaim:
            claimName: {{ include "adhoc-way-instance.claimName" . }}
          {{- else }}
          # Estado efímero: sirve para un smoke, no para una persona (al cerrar
          # el workspace pierde todo lo que no pusheó).
          emptyDir: {}
          {{- end }}
        {{- if .Values.github.credentialUrl }}
        # Minted by the kubelet for this audience and refreshed before it expires, so
        # nothing long-lived sits in the pod.
        - name: workspace-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.github.tokenAudience | quote }}
                  expirationSeconds: {{ .Values.github.tokenExpirationSeconds }}
        {{- end }}
        {{- range .Values.sources }}
        # The image itself as the volume: no copy to make and nothing to keep in sync.
        - name: {{ include "adhoc-way-instance.sourceName" . }}
          image:
            reference: {{ .image | quote }}
            pullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
