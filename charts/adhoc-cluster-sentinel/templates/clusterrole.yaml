apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "adhoc-cluster-sentinel.fullname" . }}
  labels:
    {{- include "adhoc-cluster-sentinel.labels" . | nindent 4 }}
rules:
  # List pods clusterwide to run the detectors, and delete the confirmed-broken
  # ones so their Deployment recreates them. This is the controller's whole job.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  # Read-only, for pv-zone-stuck: a pod stranded by its disk does not say WHICH zone
  # it is stuck in — that is only on the PV its claim is bound to.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get"]
  # Read-only, for node-memory-pressure: allocatable and schedulability of every node,
  # to prove a concrete destination exists before moving anything. Deliberately WITHOUT
  # `patch`: the v1 never cordons, so it cannot make a node unschedulable even by bug.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # node-memory-pressure again: `get` on replicasets resolves pod -> Deployment, `get` on
  # deployments reads the real rollout strategy (the zero-downtime guarantee is verified,
  # never assumed), and `patch` is the rollout restart itself.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
