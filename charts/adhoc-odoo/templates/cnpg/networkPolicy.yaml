{{- if .Values.cloudNativePG.enabled }}
# Ingress al Postgres: default-deny con allowlist explícita.
#
# Ojo con el alcance: en un namespace sin ninguna NetworkPolicy efectiva, la primera que
# matchee un pod convierte ese ingress de "todo permitido" a "denegado lo no listado". Por
# eso la allowlist de abajo tiene que cubrir TODO el tráfico legítimo hacia la base, no
# solo el de Odoo. Las probes del kubelet no hacen falta listarlas: no las filtra
# NetworkPolicy (verificado — el pod sigue Ready y sin restarts con esta policy activa).
#
# El selector va con el helper de nombre del Cluster, no con adhoc-odoo.fullname: los pods
# los etiqueta el operador a partir del nombre del CR, que se arma con sanitizedPgName.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adhoc-odoo.fullname" . }}-pg-ingress
  labels:
    {{- include "adhoc-odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "cnpg.pgClusterName" . }}
  policyTypes:
    - Ingress
  ingress:
    # Odoo del propio namespace: el único origen legítimo de tráfico SQL. Se discrimina por
    # adhoc.ar/app-name porque los pods de nginx comparten los app.kubernetes.io/*.
    - from:
        - podSelector:
            matchLabels:
              adhoc.ar/app-name: "odoo"
      ports:
        - protocol: TCP
          port: 5432
    # Réplicas del propio cluster: streaming replication contra el primario.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "cnpg.pgClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
    # Prometheus scrapea el exporter del instance manager (PodMonitor de cnpg).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
    # El operador CNPG consulta el instance manager: /healthz, /readyz, /pg/status.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
