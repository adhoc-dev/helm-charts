nameOverride: ""
fullnameOverride: ""

# Full host served by the pod, e.g. <prefix>.<platform-domain>.  (REQUIRED)
host: ""

# Odoo user that owns this instance. The name and the email are the identity git
# commits with inside the workspace; the id also names the user's volume.
user:
  id: ""
  name: ""
  email: ""

# --- The third-party web tool that runs in the pod ---
# Only the auth-proxy sidecar is exposed in the Service; the tool is reached over
# 127.0.0.1 inside the pod. It should listen on the configured `port` (ideally on
# 127.0.0.1 for anti-bypass; the default tool, openCode, binds 0.0.0.0, so the
# Service + NetworkPolicy are the enforced boundary).
# Defaults below run openCode; override tool.* for a different tool.
tool:
  image:
    repository: docker.io/adhoc/ops-tools
    tag: adhocWayWorkspace-latest
    # digest: pin to an exact image (overrides tag). Format: sha256:<hash>
    digest: ""
    pullPolicy: Always
  # Port the tool listens on (localhost).
  port: 3001
  # Env var name to receive the tool's own public URL, injected as https://<host>.
  # openCode needs it (OPENCODE_PUBLIC_URL) for its web/OAuth flows behind a proxy.
  # Set to "" for tools that don't need it.
  publicUrlEnvVar: OPENCODE_PUBLIC_URL
  command: []
  args: []
  # Defaults for openCode. OPENCODE_CONTAINER_PORT must match `port`.
  env:
    - name: OPENCODE_CONTAINER_PORT
      value: "4096"
    - name: OPENCODE_BUNDLES
      value: ""
  # The keys come from adhoc-way-platform's Secret; this chart only reads them.
  # "" runs without them: openCode on the person's own credential, voice off.
  envFromSecret:
    secretName: adhoc-way-platform-agent-keys
    # Env var in the pod -> key in the Secret.
    keys:
      OPENAI_API_KEY: llm
      VOICE_API_KEY: voice
  volumeMounts: []
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

# --- Authentication sidecar (adhocwayAuthProxy) ---
authProxy:
  image:
    repository: docker.io/adhoc/ops-tools
    tag: adhocwayAuthProxy-2026.08.11.3
    digest: ""
    pullPolicy: Always
  listenPort: 8080
  cookieName: way_session
  sessionTtl: 12h
  # Max lifetime the proxy accepts on an entry token. Kept above the signer's
  # entryTtl (5m) so a freshly-minted token always validates (provisioning wait).
  maxEntryTtl: 10m
  # ConfigMap (same namespace) with the signer Ed25519 public key.
  # Created by adhoc-way-platform.
  entryPubKeyConfigMap: adhoc-way-platform-entry-pubkey
  entryPubKeyKey: pubkey
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

service:
  port: 80

ingress:
  istio:
    enabled: true
    # Dedicated *.<domain> Gateway (from the adhoc-way-platform chart).
    gateway: adhoc-way-platform-gateway

# Accept ingress to the proxy port only from the ingress gateway namespace.
# Defense in depth — the tool already listens only on 127.0.0.1.
networkPolicy:
  enabled: true
  gatewayNamespace: istio-system

# --- GitHub access ---
# The pod carries no GitHub credential. git asks the platform for one per operation
# through a credential helper, and proves which instance is asking with the service
# account token Kubernetes projects into it: audience-scoped, rotated by the kubelet,
# and stored nowhere.
#
# Leave credentialUrl empty and the workspace runs with no access to GitHub, which is
# a workspace that cannot push and not a broken one.
github:
  credentialUrl: ""
  # Audience the token is minted for. Its own and not the cluster's default, so a token
  # minted for anything else cannot be replayed against the platform. Must match what
  # the platform validates.
  tokenAudience: adhocway-credential
  # How long each token is valid. This is the window in which a leaked one still works:
  # validating it offline cannot tell that the pod is gone, so only expiry closes it.
  # 600 is the shortest the kubelet honours.
  tokenExpirationSeconds: 600
  # Where the token is projected. The helper reads it from there on every call, so a
  # rotation lands without restarting anything.
  tokenMountPath: /var/run/adhocway

# --- What the workspace works on ---
# Projects are cloned on start if missing and brought up to date if already there,
# keeping whatever the person had in progress; a conflict is left in the tree for the
# agent to resolve. `path` is relative to the workspace root, and a component's to the
# project that mounts it. `access` is what the person may do with that repository.
#
#   workspace:
#     projects:
#       - path: handbook
#         clone_url: https://git.example.com/acme/handbook
#         access: write
#         components:
#           - path: memory
#             clone_url: https://git.example.com/acme/handbook-memory
#             access: read
#
# `components` and `access` are optional; `access` is `read` or `write` and is
# informational — what a credential is actually good for is decided when it is asked
# for. `clone_url` has to be https: the pod authenticates through the credential
# helper and holds no ssh key.
#
# Passed as YAML and handed to the image as JSON.
workspace: {}

# --- Sources the workspace reads ---
# Images mounted read-only under /mnt, each linked into the workspace. `srcPath` is the
# directory to expose, inside the image; `dstPath` is the name it shows up under, in the
# root of the workspace (an optional dot, then lowercase letters, digits and dashes).
# `pullPolicy` is optional (default IfNotPresent). See the readme.
sources:
  - image: dockerhub.adhoc.inc/adhoc/odoo-adhoc:19.0.dev
    srcPath: home/odoo/src
    dstPath: .oba-19
    pullPolicy: Always
  - image: dockerhub.adhoc.inc/adhoc/odoo-adhoc:18.0.dev
    srcPath: home/odoo/src
    dstPath: .oba-18
    pullPolicy: Always
  - image: dockerhub.adhoc.inc/adhoc/odoo-adhoc:20.0.dev
    srcPath: home/odoo/src
    dstPath: .oba-20
    pullPolicy: Always

# --- Identity of the pod ---
# The subject of the projected token names this service account, which is how the
# platform resolves which instance is asking. Empty uses the release name, which is
# already the instance: the orchestrator does not have to pass it.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Fleet-wide identification labels (adhoc-odoo / weblate convention).
adhoc:
  product: adhocway
  appName: adhoc-way-instance

# --- User state ---
# The volume belongs to the USER, not to this instance: a user may open more than
# one surface and all of them must see the same files. So the claim is named after
# the user, lives outside this release's lifecycle (it is kept on uninstall), and
# any surface of that user creates it if it is not there yet.
state:
  # false = ephemeral emptyDir. Fine for a smoke test, wrong for a person: closing
  # the workspace loses whatever they had not pushed.
  persistent: true

  # Claim name. Empty derives it from the user id (way-user-<id>), which is what
  # makes two surfaces of the same person share one volume.
  claimName: ""

  # Create the claim when it does not exist. Set to false to require that someone
  # provisioned it beforehand.
  #
  # The identity running the install needs `get` on claims, not only `create`.
  # Without it the install stops at render time with a message that names the
  # permission and the service account — lookup propagates the 403.
  create: true

  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

  # Everything the user owns lives under the home: agent state in dotfiles and
  # projects in workspace/.
  mountPath: /home/odoo
  # Mounting a subdirectory instead of the volume root lets the same disk hold
  # more than one thing later, and keeps the filesystem's lost+found out of the
  # user's home.
  subPath: home

# fsGroup must match the group of the tool image's user (1001 in
# adhocWayWorkspace), or the pod cannot write to its own volume.
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

volumes: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
