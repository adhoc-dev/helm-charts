nameOverride: ""
fullnameOverride: ""

# Odoo user that owns this state (informational; goes to labels and annotations).
user:
  id: ""
  email: ""

state:
  # Claim name. Empty = the release name. This is the name each surface of the
  # user references as `state.existingClaim`.
  claimName: ""

  # Volume size. Small on purpose: this holds configuration and source
  # checkouts, not artifacts or datasets.
  size: 1Gi

  # "" uses the cluster default StorageClass.
  #
  # Access mode note: with ReadWriteOnce the volume can be mounted by several
  # pods only while they run on the SAME node. That is enough for one surface at
  # a time, and for two surfaces if they are co-scheduled. Two surfaces on
  # different nodes at once needs a ReadWriteMany class instead.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

  # Keep the volume when the release is uninstalled. There is no backup of this
  # data, so the default refuses to make deletion a one-command accident: the
  # PVC has to be removed explicitly.
  retainOnUninstall: true

  # Extra annotations/labels for the claim.
  annotations: {}
  labels: {}
