{{- /* Created only when there is no existingSecret and an inline key was
       provided (dev). In prod use agentKeys.existingSecret. */ -}}
{{- if and (not .Values.agentKeys.existingSecret) .Values.agentKeys.secret.llm }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adhoc-way-platform.agentKeysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adhoc-way-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  llm: {{ .Values.agentKeys.secret.llm | quote }}
{{- end }}
