apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adhoc-cluster-sentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adhoc-cluster-sentinel.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Hard-coded to 1: guardrail state (cooldown, circuit-breaker, confirmation
  # windows) lives in-process and is not shared, so a second replica could delete
  # past MAX_RECREATIONS_PER_TICK and ignore cooldowns. Needs leader election first.
  replicas: 1
  selector:
    matchLabels:
      {{- include "adhoc-cluster-sentinel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adhoc-cluster-sentinel.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "adhoc-cluster-sentinel.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          env:
            - name: MODE_OVERRIDE
              value: {{ .Values.modeOverride | quote }}
            - name: DISABLED_CHECKS
              value: {{ .Values.disabledChecks | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
