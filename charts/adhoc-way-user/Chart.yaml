annotations:
  category: DevOps
apiVersion: v2
name: adhoc-way-user
description: >
  Persistent state for one user of the "way" platform: a single volume that holds
  their agent configuration and their projects. Installed once per user, NOT per
  instance — a user may open more than one surface, and all of them must see the
  same files. Separate release so uninstalling a surface never takes the user's
  data with it.

type: application

version: 0.1.0

home: "https://github.com/adhoc-dev/helm-charts"
sources:
  - "https://github.com/ingadhoc/devops-ops-tools"
maintainers:
  - name: azacchino
    email: az@adhoc.inc
